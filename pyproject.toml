[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "fast-factoradic"
version = "0.1.0"
description = "O(1) calculations of a permutation in nPr-space via factoradics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.0",
  "nox>=2024.4.15",
  "pytest>=8.0",
  "ruff>=0.11.0",
]
